<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Covered</title>
<script>
  window.__log = [];
  const log = (e, name) => window.__log.push(name + (e.isTrusted ? ":trusted" : ""));
  // An overlay over the whole page that goes away after ms, like a loading spinner.
  window.spin = (ms) => {
    const s = document.createElement("div");
    s.id = "spinner";
    s.textContent = "Loading";
    s.onclick = (e) => log(e, "spinner");
    document.body.append(s);
    setTimeout(() => s.remove(), ms);
  };
</script>
<style>
  body { min-height: 1600px; }
  /* Across the middle of the viewport, where a target scrolled into view lands. */
  .cookie-banner { position: fixed; left: 0; right: 0; top: 25%; height: 50%; background: #eee; z-index: 10; }
  #spinner { position: fixed; inset: 0; background: rgba(255, 255, 255, .6); z-index: 20; }
  /* A custom checkbox: a transparent input under a drawn box, both inside the label. */
  .check { position: relative; display: inline-block; padding-left: 28px; }
  .check input { position: absolute; left: 0; top: 0; width: 20px; height: 20px; margin: 0; opacity: 0; }
  .check .box { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border: 1px solid #333; }
</style>
</head>
<body>
<h1>Covered page</h1>
<div style="height: 600px">Room above, so the targets can scroll to the middle.</div>
<p><button id="buy" onclick="log(event, 'buy')">Buy</button></p>
<p>
  <label class="check"><input type="checkbox" id="agree" onchange="log(event, 'agree')"><span class="box"></span>I agree</label>
</p>

<div class="cookie-banner" onclick="log(event, 'banner')">
  <p>We use cookies.</p>
  <button id="accept" onclick="event.stopPropagation(); log(event, 'accept'); this.parentElement.remove()">Accept</button>
</div>
</body>
</html>
