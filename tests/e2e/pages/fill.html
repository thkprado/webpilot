<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fill</title>
</head>
<body>
<h1>Sign up</h1>
<form id="signup">
  <label for="name">Name</label> <input id="name" name="name">
  <label for="email">Email</label> <input id="email" name="email" type="email">
  <label for="password">Password</label> <input id="password" name="password" type="password">
  <label for="code">Code</label> <input id="code" name="code">
  <label for="bio">Bio</label> <textarea id="bio" name="bio"></textarea>
  <label for="country">Country</label>
  <select id="country" name="country">
    <option value="">Choose</option>
    <option value="br">Brazil</option>
    <option value="pt">Portugal</option>
  </select>
  <span id="state-slot"></span>
  <label><input type="checkbox" id="terms" name="terms"> I accept the terms</label>
  <label><input type="checkbox" id="news" name="news" checked> Newsletter</label>
  <label><input type="radio" id="plan-free" name="plan" value="free" checked> Free</label>
  <label><input type="radio" id="plan-pro" name="plan" value="pro"> Pro</label>
  <div id="dark" role="switch" aria-checked="false" tabindex="0">Dark mode</div>
  <label for="age">Age</label> <input id="age" name="age">
  <label for="cv">CV</label> <input id="cv" name="cv" type="file">
  <label for="ref">Reference</label> <input id="ref" name="ref" value="R-1" readonly>
  <div id="notes" contenteditable="true" aria-label="Notes"></div>
  <button type="submit">Create account</button>
</form>
<p id="out"></p>
<script>
  window.__log = [];
  const log = (x) => window.__log.push(x);
  const form = document.getElementById("signup");
  form.addEventListener("change", (e) => log("change:" + e.target.id));
  // A mask, as on phone and card fields: what the field keeps differs from what was typed.
  document.getElementById("code").addEventListener("input", (e) => { e.target.value = e.target.value.toUpperCase(); });
  // A field that appears a moment after a country is chosen, as dependent fields do.
  document.getElementById("country").addEventListener("change", (e) => {
    const slot = document.getElementById("state-slot");
    slot.replaceChildren();
    if (e.target.value !== "br") return;
    setTimeout(() => {
      slot.innerHTML = '<label for="state">State</label> <input id="state" name="state">';
    }, 300);
  });
  // A custom switch that re-renders itself on click, as framework components do.
  document.addEventListener("click", (e) => {
    const sw = e.target.closest("#dark");
    if (!sw) return;
    const next = sw.cloneNode(true);
    next.setAttribute("aria-checked", sw.getAttribute("aria-checked") === "true" ? "false" : "true");
    sw.replaceWith(next);
    log("switch:" + next.getAttribute("aria-checked"));
  });
  document.getElementById("age").addEventListener("change", (e) => {
    if (Number(e.target.value) < 18) alert("You must be 18 or older");
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const data = Object.fromEntries([...new FormData(form)].filter(([, v]) => typeof v === "string"));
    data.dark = document.getElementById("dark").getAttribute("aria-checked");
    log({ submitted: data });
    document.getElementById("out").textContent = "Created " + data.name;
  });
</script>
</body>
</html>
