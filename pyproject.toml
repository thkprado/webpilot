[project]
name = "webpilot"
version = "0.1.8"
description = "Drive your real Chromium-based browser (Chrome, Edge, Brave, ...), or a temporary one, from coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thiago Kato Prado" }]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "selectolax>=0.3.27",
    "typer>=0.15.4",
    "websockets>=15.0",
]

[project.scripts]
webpilot = "webpilot.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/pages"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # errors, unused names and import order; no style rules
