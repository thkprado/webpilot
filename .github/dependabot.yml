version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    commit-message:
      prefix: "Extension"
  - package-ecosystem: uv
    directory: /
    # Bump only uv.lock: raising the floors in pyproject.toml would force
    # newer versions on everyone who installs the package.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    commit-message:
      prefix: "Deps"
