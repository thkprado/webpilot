name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported and newest released.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  # The floors in pyproject.toml are what users may get; uv.lock alone never tests them.
  python-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e . --group dev
      - run: uv run --no-sync pytest -q

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The extension driven by a headless temporary browser against local pages (tests/e2e, see CONTRIBUTING).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            tests/pages/combobox/package-lock.json
      - run: npm ci && npm run build
        working-directory: extension
      - run: npm ci && npm run build
        working-directory: tests/pages/combobox
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: uv run playwright install --with-deps chromium
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv run pytest -m e2e --basetemp="$RUNNER_TEMP/e2e"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: |
            ${{ runner.temp }}/e2e/**/failure.png
            ${{ runner.temp }}/e2e/**/*.log
            ${{ runner.temp }}/e2e/**/*.jsonl
            ${{ runner.temp }}/e2e/watchdog.txt
          if-no-files-found: ignore
